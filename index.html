<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anurag CSC Center - Digital Services Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3>अनुराग सीएससी सेंटर (Anurag CSC Center)</h3>
                <p class="mb-0">आय, जाति, निवास एवं अन्य डिजिटल सेवाएं</p>
            </div>
            <div class="card-body">
                <!-- Certificate Form -->
                <form id="certificateForm" action="#" method="POST">
                    
                    <div class="mb-3">
                        <label for="customerName" class="form-label">आवेदक का नाम (Applicant Name)</label>
                        <input type="text" class="form-control" id="customerName" name="customerName" required placeholder="पूरा नाम दर्ज करें">
                    </div>

                    <div class="mb-3">
                        <label for="customerMobile" class="form-label">मोबाइल नंबर (Mobile Number)</label>
                        <input type="tel" class="form-control" id="customerMobile" name="customerMobile" required pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर">
                    </div>

                    <div class="mb-3">
                        <label for="certificateType" class="form-label">सेवा का चयन करें (Select Service)</label>
                        <select class="form-select" id="certificateType" name="certificateType" required>
                            <option value="">-- सेवा चुनें --</option>
                            <option value="Income">आय प्रमाण पत्र (Income Certificate) - ₹80</option>
                            <option value="Caste">जाति प्रमाण पत्र (Caste Certificate) - ₹80</option>
                            <option value="Domicile">निवास प्रमाण पत्र (Domicile Certificate) - ₹80</option>
                        </select>
                    </div>

                    <div class="alert alert-info py-2" role="alert">
                        <small>📌 नोट: फॉर्म सबमिट करने पर Razorpay का पेमेंट गेटवे खुलेगा, जहाँ ऑनलाइन <strong>₹80</strong> भुगतान करने के बाद फॉर्म स्वतः सबमिट हो जाएगा।</small>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">भुगतान करें और फॉर्म सबमिट करें (Pay ₹80 & Submit)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Razorpay Integration Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("certificateForm");

            if (form) {
                form.addEventListener("submit", function (e) {
                    // Form ko bina payment ke turant submit hone se rokein
                    e.preventDefault(); 

                    var options = {
                        "key": "YOUR_RAZORPAY_KEY_ID", // <-- Yahan apni real Razorpay Key ID dalein
                        "amount": 8000, // ₹80 ke liye amount paise mein (80 * 100)
                        "currency": "INR",
                        "name": "Anurag CSC Center",
                        "description": "Certificate Application Fee (₹80)",
                        "handler": function (response) {
                            // Payment safal hone par yeh message aayega
                            alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                            
                            // Payment hone ke baad form aage submit ho jayega
                            HTMLFormElement.prototype.submit.call(form);
                        },
                        "modal": {
                            "ondismiss": function() {
                                alert("Payment cancel ho gaya. Form submit nahi hua.");
                            }
                        },
                        "prefill": {
                            "name": document.getElementById('customerName').value,
                            "contact": document.getElementById('customerMobile').value
                        },
                        "theme": {
                            "color": "#0d6efd"
                        }
                    };

                    var rzp1 = new Razorpay(options);
                    rzp1.open();
                });
            }
        });
    </script>

</body>
</html>
