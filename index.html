<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अनुराग सीएससी सेंटर - ऑनलाइन सर्विसेज</title>
    <!-- FontAwesome & Firebase SDKs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 0; color: #1e293b; }
        header { background: #1e3a8a; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button.submit-btn { background: #16a34a; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        button.submit-btn:hover { background: #15803d; }
        
        /* Payment Modal CSS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .payment-modal-box { background: #fff; width: 90%; max-width: 420px; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.3); }
        .qr-container { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .pay-btn-gateway { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .pay-btn-gateway:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-laptop-code"></i> अनुराग सीएससी सेंटर</h1>
        <p>डिजिटल सेवा पोर्टल - प्रमाण पत्र आवेदन एवं भुगतान</p>
    </header>

    <div class="container">
        <h2>आय प्रमाण पत्र (Income Certificate) आवेदन फॉर्म</h2>
        <form onsubmit="submitApplication(event, 'Income Certificate')">
            <div class="form-group">
                <label>आवेदक का नाम (Applicant Name)</label>
                <input type="text" id="inc_name" required>
            </div>
            <div class="form-group">
                <label>माता का नाम (Mother's Name)</label>
                <input type="text" id="inc_mother" required>
            </div>
            <div class="form-group">
                <label>संरक्षक का प्रकार (Guardian Type)</label>
                <select id="inc_gtype">
                    <option value="Father">पिता</option>
                    <option value="Husband">पति</option>
                </select>
            </div>
            <div class="form-group">
                <label>संरक्षक का नाम (Guardian Name)</label>
                <input type="text" id="inc_gname" required>
            </div>
            <div class="form-group">
                <label>क्षेत्र (Area)</label>
                <select id="inc_area">
                    <option value="Rural">ग्रामीण (Rural)</option>
                    <option value="Urban">नगरीय (Urban)</option>
                </select>
            </div>
            <div class="form-group">
                <label>ग्राम / मोहल्ला (Village / Ward)</label>
                <input type="text" id="inc_village" required>
            </div>
            <div class="form-group">
                <label>पोस्ट (Post)</label>
                <input type="text" id="inc_post" required>
            </div>
            <div class="form-group">
                <label>थाना (Police Station)</label>
                <input type="text" id="inc_thana" required>
            </div>
            <div class="form-group">
                <label>विकास खंड (Block)</label>
                <input type="text" id="inc_block" required>
            </div>
            <div class="form-group">
                <label>तहसील (Tehsil)</label>
                <input type="text" id="inc_tahsil" required>
            </div>
            <div class="form-group">
                <label>जिला (District)</label>
                <input type="text" id="inc_district" value="एटा" required>
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर (Mobile Number)</label>
                <input type="tel" id="inc_mobile" required>
            </div>
            <div class="form-group">
                <label>वार्षिक आय (Annual Income in Rs.)</label>
                <input type="number" id="inc_income" required>
            </div>
            <div class="form-group">
                <label>व्यवसाय (Occupation)</label>
                <input type="text" id="inc_occ" required>
            </div>
            <div class="form-group">
                <label>फोटो अपलोड करें (Photo)</label>
                <input type="file" id="inc_photo" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>आधार कार्ड अपलोड करें (Aadhar)</label>
                <input type="file" id="inc_aadhar" accept="image/*,application/pdf" required>
            </div>
            <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> फॉर्म सबमिट करें और भुगतान करें</button>
        </form>
    </div>

    <!-- Payment Gateway Modal -->
    <div id="paymentModal" class="modal-overlay">
        <div class="payment-modal-box">
            <h3 style="color: #1e3a8a; margin-bottom: 10px;"><i class="fa-solid fa-qrcode"></i> ऑनलाइन भुगतान (Payment)</h3>
            <p style="font-size: 14px; color: #475569;">Form submit karne ke liye shulk (Fee) ₹60 bhugtan karein:</p>
            
            <div class="qr-container">
                <p style="font-size: 14px; font-weight: 600; color: #16a34a; margin-bottom: 8px;">UPI ID: rohitkumar396s@okaxis</p>
                <div style="font-size: 12px; color: #64748b;">(Payment karne ke baad 'Payment Ho Gaya' par click karein)</div>
            </div>

            <button onclick="confirmPaymentAndSubmit()" class="pay-btn-gateway"><i class="fa-solid fa-check-circle"></i> Payment Ho Gaya, Form Submit Karein</button>
            <button onclick="closePaymentModal()" style="background: #dc2626; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: 600;">रद्द करें (Cancel)</button>
        </div>
    </div>

    <script>
        // Firebase Configuration (Yahan apni firebase details verify kar lein)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pendingFormData = null;

        function submitApplication(event, certType) {
            event.preventDefault();
            
            let nowObj = new Date();
            let yyyy = nowObj.getFullYear();
            let mm = String(nowObj.getMonth() + 1).padStart(2, '0');
            let dd = String(nowObj.getDate()).padStart(2, '0');
            let rawDateString = `${yyyy}-${mm}-${dd}`;

            pendingFormData = {
                appId: 'CSC' + Math.floor(100000 + Math.random() * 900000),
                type: certType,
                date: nowObj.toLocaleString('en-IN'),
                rawDate: rawDateString,
                status: 'Pending',
                certData: null, photo: null, aadhar: null
            };

            let photoInput, aadharInput;
            if(certType === 'Income Certificate') {
                pendingFormData.name = document.getElementById('inc_name').value;
                pendingFormData.mother = document.getElementById('inc_mother').value;
                pendingFormData.guardianType = document.getElementById('inc_gtype').value;
                pendingFormData.guardianName = document.getElementById('inc_gname').value;
                pendingFormData.area = document.getElementById('inc_area').value;
                pendingFormData.village = document.getElementById('inc_village').value;
                pendingFormData.post = document.getElementById('inc_post').value;
                pendingFormData.thana = document.getElementById('inc_thana').value;
                pendingFormData.block = document.getElementById('inc_block').value;
                pendingFormData.tahsil = document.getElementById('inc_tahsil').value;
                pendingFormData.district = document.getElementById('inc_district').value;
                pendingFormData.mobile = document.getElementById('inc_mobile').value;
                pendingFormData.incomeOrDetails = 'Annual Income: Rs. ' + document.getElementById('inc_income').value + ' | Occupation: ' + document.getElementById('inc_occ').value;
                photoInput = document.getElementById('inc_photo').files[0];
                aadharInput = document.getElementById('inc_aadhar').files[0];
            }

            let readerCount = 0;
            let totalReaders = (photoInput ? 1 : 0) + (aadharInput ? 1 : 0);

            function checkAndShowModal() {
                if(readerCount === totalReaders) {
                    document.getElementById('paymentModal').style.display = 'flex';
                }
            }

            if(totalReaders === 0) {
                document.getElementById('paymentModal').style.display = 'flex';
                return;
            }

            if(photoInput) {
                let reader = new FileReader();
                reader.onload = function(e) { pendingFormData.photo = e.target.result; readerCount++; checkAndShowModal(); };
                reader.readAsDataURL(photoInput);
            }
            if(aadharInput) {
                let reader = new FileReader();
                reader.onload = function(e) { pendingFormData.aadhar = e.target.result; readerCount++; checkAndShowModal(); };
                reader.readAsDataURL(aadharInput);
            }
        }

        function confirmPaymentAndSubmit() {
            closePaymentModal();
            
            db.ref('csc_applications').push(pendingFormData).then(() => {
                alert("फॉर्म सफलतापूर्वक सबमिट हो गया और डेटाबेस में सेव हो गया! Application ID: " + pendingFormData.appId);
                document.querySelectorAll('form').forEach(f => f.reset());
                pendingFormData = null;
            }).catch((error) => {
                alert("डाटा सेव करने में त्रुटि: " + error.message);
            });
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }
    </script>
</body>
</html>
