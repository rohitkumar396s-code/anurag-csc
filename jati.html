<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जाति प्रमाण पत्र हेतु आवेदन-पत्र</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f3f8; padding: 20px; }
        .form-container { max-width: 600px; background: #ffffff; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #334155; margin-bottom: 8px; font-size: 14px; }
        label span { color: #dc2626; }
        input[type="text"], input[type="tel"], select, input[type="file"] {
            width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .submit-btn { background: #1e3a8a; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #1d4ed8; }
        .row-flex { display: flex; gap: 10px; }
        .row-flex select { flex: 1; }
        .row-flex input { flex: 2; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>जाति प्रमाण पत्र हेतु आवेदन-पत्र</h2>
    <form action="#" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>1. प्रार्थी का नाम (हिंदी में): <span>*</span></label>
            <input type="text" name="name_hi" placeholder="प्रार्थी का नाम दर्ज करें" required>
        </div>
        <div class="form-group">
            <label>2. प्रार्थी का नाम (अंग्रेजी में): <span>*</span></label>
            <input type="text" name="name_en" placeholder="Enter applicant name" required>
        </div>
        <div class="form-group">
            <label>3. संबंधित का चयन करें एवं नाम लिखें: <span>*</span></label>
            <div class="row-flex">
                <select name="relation_type" required>
                    <option value="">-- चुनें --</option>
                    <option value="Father">पिता (Father)</option>
                    <option value="Husband">पति (Husband)</option>
                    <option value="Guardian">संरक्षक (Guardian)</option>
                </select>
                <input type="text" name="guardian_name" placeholder="नाम दर्ज करें" required>
            </div>
        </div>
        <div class="form-group">
            <label>4. माता का नाम: <span>*</span></label>
            <input type="text" name="mother_name" placeholder="माता का नाम दर्ज करें" required>
        </div>
        <div class="form-group">
            <label>5. जाति (Caste) विवरण: <span>*</span></label>
            <select name="caste_category" required style="margin-bottom: 8px;">
                <option value="">-- वर्ग (Category) चुनें --</option>
                <option value="SC">अनुसूची जाति (SC)</option>
                <option value="ST">अनुसूची जनजाति (ST)</option>
                <option value="OBC">अन्य पिछड़ा वर्ग (OBC)</option>
                <option value="General">सामान्य (General)</option>
            </select>
            <input type="text" name="sub_caste" placeholder="उप-जाति लिखें" required>
        </div>
        <div class="form-group">
            <label>6. मोबाइल नंबर: <span>*</span></label>
            <input type="tel" name="mobile" placeholder="10 अंकों का मोबाइल नंबर दर्ज करें" pattern="[0-9]{10}" required>
        </div>
        <div class="form-group">
            <label>7. आधार कार्ड नंबर (12 अंक): <span>*</span></label>
            <input type="text" name="aadhaar" placeholder="आधार नंबर दर्ज करें" pattern="[0-9]{12}" maxlength="12" required>
        </div>
        <div class="form-group">
            <label>8. तहसील (Tehsil) चुनें: <span>*</span></label>
            <select name="tehsil" required>
                <option value="">-- अपनी तहसील चुनें --</option>
                <option value="Etah Sadar">एटा सदर (Etah Sadar)</option>
                <option value="Aliganj">अलीगंज (Aliganj)</option>
                <option value="Jalesar">जलेसर (Jalesar)</option>
            </select>
        </div>
        <div class="form-group">
            <label>9. पिन कोड (Pincode) दर्ज करें: <span>*</span></label>
            <input type="text" name="pincode" placeholder="जैसे: 207125" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <div class="form-group">
            <label>10. गाँव / क्षेत्र का नाम लिखें: <span>*</span></label>
            <input type="text" name="village" placeholder="अपने गाँव या क्षेत्र का नाम दर्ज करें" required>
        </div>
        <div class="form-group">
            <label>11. जिला (District): <span>*</span></label>
            <input type="text" name="district" value="Etah (एटा)" readonly required style="background-color: #f1f5f9;">
        </div>
        <div class="form-group">
            <label>12. प्रार्थी की फोटो अपलोड करें: <span>*</span></label>
            <input type="file" name="applicant_photo" accept="image/*" required>
        </div>
        <div class="form-group">
            <label>13. आधार कार्ड की फोटो/कॉपी अपलोड करें: <span>*</span></label>
            <input type="file" name="aadhaar_doc" accept="image/*,application/pdf" required>
        </div>
        <button type="submit" class="submit-btn">सुरक्षित करें एवं आगे बढ़ें</button>
    </form>
</div>
</body>
</html>
